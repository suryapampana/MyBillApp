                                            </div>
                                            <div>
                                                <label className="text-[9px] font-black uppercase text-[var(--sys-muted)] ml-1 block mb-2 tracking-widest">Icon</label>

                                            </div>
                                            <div className="pt-4 mt-2 border-t border-[var(--sys-border)] space-y-4">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase text-[var(--sys-text)] tracking-widest ml-1">Metadata Rows</span><button type="button" onClick=${function(){setModal(Object.assign({}, modal, {fields: (modal.fields || []).concat([{ label: 'Account', value: '', isCustomMode: false }])}));}} className="text-[var(--sys-accent)] text-[9px] font-black bg-[var(--sys-accent-soft)] px-3 py-1.5 rounded-lg shadow-sm active:scale-95 uppercase tracking-widest">+ Add</button></div>
                                                ${(modal.fields || []).map(function(f, i){return html`<div key=${i} className="bg-[var(--sys-bg)] p-4 rounded-[1.2rem] border border-[var(--sys-border)] relative shadow-sm flex flex-col gap-3"><button type="button" onClick=${function(){setModal(Object.assign({}, modal, {fields: modal.fields.filter(function(_,idx){return idx!==i;})}));}} className="absolute top-3 right-3 p-2 bg-[var(--sys-solid)] rounded-lg border border-[var(--sys-border)] text-rose-500 shadow-sm active:scale-95"><${Icon} name="Trash" size=${14} /></button><div><label className="text-[8px] font-black uppercase text-[var(--sys-muted)] block mb-1 tracking-widest">Key</label>${f.isCustomMode ? html`<div className="flex gap-2 w-[80%]"><input className="flex-1 bg-[var(--sys-solid)] text-[var(--sys-text)] rounded-[0.8rem] px-3 py-2 font-bold border border-[var(--sys-accent)] shadow-inner outline-none" placeholder="Label..." value=${f.label || ""} onChange=${function(e){var n=JSON.parse(JSON.stringify(modal.fields || [])); n[i].label=e.target.value; setModal(Object.assign({}, modal, {fields:n}));}} /><button type="button" onClick=${function(){var n=JSON.parse(JSON.stringify(modal.fields || [])); if(n[i].label.trim()!=='') {n[i].isCustomMode=false; setModal(Object.assign({}, modal, {fields:n}));}}} className="bg-[var(--sys-accent)] text-white px-2 rounded-[0.8rem]"><${Icon} name="Check" size=${14}/></button></div>` : html`<select value=${f.label || ""} onChange=${function(e){var n=JSON.parse(JSON.stringify(modal.fields || [])); if(e.target.value === 'CUSTOM_KEY') { n[i].isCustomMode = true; n[i].label = ''; } else { n[i].label = e.target.value; } setModal(Object.assign({}, modal, {fields:n}));}} className="w-[80%] bg-[var(--sys-solid)] text-[var(--sys-text)] rounded-[0.8rem] px-3 py-2 font-black uppercase border border-[var(--sys-border)] outline-none cursor-pointer shadow-sm"><option value="Note">Note</option><option value="Account">Account</option><option value="CUSTOM_KEY">Other..</option></select>`}</div><div><label className="text-[8px] font-black uppercase text-[var(--sys-muted)] block mb-1 tracking-widest">Info</label><input value=${f.value || ""} onChange=${function(e){var n=JSON.parse(JSON.stringify(modal.fields || [])); n[i].value=e.target.value; setModal(Object.assign({}, modal, {fields:n}));}} className="w-full bg-[var(--sys-solid)] text-[var(--sys-text)] rounded-[0.8rem] px-3 py-2 font-bold border border-[var(--sys-border)] shadow-sm outline-none focus:border-[var(--sys-accent)] transition-colors" placeholder="Details..." /></div></div>`;})}
                                            </div>
                                        </div>
                                    `}
                                </div>
                                ${isEditMode ? html`<div className="p-4 border-t border-[var(--sys-border)] shrink-0 bg-[var(--sys-card)]"><button onClick=${handleSaveNote} className="w-full font-black py-4 bg-[var(--sys-accent)] text-white rounded-2xl shadow-xl shadow-[var(--sys-accent)]/30 text-sm active:scale-95 transition-all uppercase tracking-widest">Save Record</button></div>` : null}
                            </div>
                        </div>
                    `);
                }

                if (calPopup !== null) {
                    mList.push(html`
                        <div key="modal-cal" className="fixed inset-0 z-[9999] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-in" onClick=${function(){setCalPopup(null);}}>
                            <div className="bg-[var(--sys-solid)] w-full max-w-[300px] rounded-[2rem] shadow-2xl border border-[var(--sys-border)] overflow-hidden" onClick=${function(e){e.stopPropagation();}}>
                                <div className="p-4 bg-[var(--sys-bg)] border-b border-[var(--sys-border)] flex justify-between items-center">
                                    <h3 className="text-xs font-black uppercase tracking-widest text-[var(--sys-text)]">Day ${calPopup}</h3>
                                    <button onClick=${function(){setCalPopup(null);}} className="p-1.5 bg-[var(--sys-solid)] rounded-full shadow-sm border border-[var(--sys-border)]"><${Icon} name="Close" size=${14} className="text-rose-500" /></button>
                                </div>
                                <div className="p-5 space-y-3 max-h-[50vh] overflow-y-auto no-scrollbar">
                                    ${activeWS?activeWS.subs.filter(function(s){return parseInt(s.day) === calPopup;}).map(function(s){ return html`<div key=${s.id} onClick=${function(){setCalPopup(null); setModal(s); setIsEditMode(false);}} className="flex justify-between items-center py-3 px-4 rounded-xl bg-[var(--sys-bg)] cursor-pointer transition-colors active:scale-95 border border-[var(--sys-border)] shadow-sm"><div className="flex items-center gap-3"><div className=${`w-2 h-2 rounded-full ${s.color || 'bg-indigo-600'} shadow-sm`}></div><div className="flex flex-col"><span className="truncate w-24 text-xs font-bold text-[var(--sys-text)] leading-tight">${s.name || ''}</span><span className="text-[8px] font-black uppercase text-[var(--sys-muted)] tracking-widest mt-1">${s.cat || ''}</span></div></div><span className="font-black text-sm text-[var(--sys-text)]">₹${(parseFloat(s.amount)||0).toLocaleString()}</span></div>`; }):null}
                                </div>
                            </div>
                        </div>
                    `);
                }

                if (catManageModal) {
                    mList.push(html`
                        <div key="modal-cat" className="fixed inset-0 z-[9999] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-in">
                            <div className="bg-[var(--sys-solid)] w-full max-w-[320px] rounded-[2rem] shadow-2xl border border-[var(--sys-border)] overflow-hidden">
                                <div className="p-4 bg-[var(--sys-bg)] border-b border-[var(--sys-border)] flex justify-between items-center">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-[var(--sys-text)]">Categories</h3>
                                    <button onClick=${function(){setCatManageModal(false); setCatEditTarget(null);}} className="p-1.5 bg-[var(--sys-solid)] rounded-full shadow-sm border border-[var(--sys-border)]"><${Icon} name="Close" size=${14} className="text-rose-500" /></button>
                                </div>
                                <div className="p-5 space-y-3 max-h-[60vh] overflow-y-auto no-scrollbar">
                                    ${activeWS?(activeWS.categories || []).map(function(c, i) { var isEditing = catEditTarget && catEditTarget.oldName === c; return html`<div key=${i} className="flex items-center gap-2 bg-[var(--sys-bg)] p-2 rounded-[1rem] border border-[var(--sys-border)] shadow-sm">${isEditing ? html`<input autoFocus value=${catEditTarget.newName} onChange=${function(e){setCatEditTarget(Object.assign({}, catEditTarget, {newName: e.target.value}));}} className="flex-1 bg-[var(--sys-solid)] text-[var(--sys-text)] px-3 py-2.5 font-bold rounded-[0.8rem] border border-[var(--sys-accent)] outline-none shadow-inner min-w-0" /><button onClick=${function(){ var oldC = catEditTarget.oldName; var newC = catEditTarget.newName.trim(); if(newC && newC !== oldC) { var newCats = activeWS.categories.map(function(cat){ return cat === oldC ? newC : cat; }); var newSubs = activeWS.subs.map(function(s){ return s.cat === oldC ? Object.assign({}, s, {cat: newC}) : s; }); updateActiveWS({ categories: newCats, subs: newSubs }); if(selectedCat === oldC) setSelectedCat(newC); } setCatEditTarget(null); }} className="p-2.5 bg-emerald-500 text-white rounded-[0.8rem] shadow-sm active:scale-95 shrink-0"><${Icon} name="Check" size=${14} /></button>` : html`<span className="flex-1 text-[11px] font-black uppercase tracking-widest text-[var(--sys-text)] pl-3 truncate min-w-0">${c}</span><button onClick=${function(){setCatEditTarget({oldName: c, newName: c});}} className="p-2.5 text-[var(--sys-accent)] bg-[var(--sys-solid)] rounded-[0.8rem] shadow-sm border border-[var(--sys-border)] active:scale-95 shrink-0"><${Icon} name="Edit" size=${14} /></button><button onClick=${function(){ requestConfirm("Delete Category?", "Notes will be marked 'General'.", function() { var newCats = activeWS.categories.filter(function(cat){ return cat !== c; }); var newSubs = activeWS.subs.map(function(s){ return s.cat === c ? Object.assign({}, s, {cat: 'General'}) : s; }); if(newCats.indexOf('General') === -1) newCats.push('General'); updateActiveWS({ categories: newCats, subs: newSubs }); if(selectedCat === c) setSelectedCat('All'); }); }} className="p-2.5 text-rose-500 bg-[var(--sys-solid)] rounded-[0.8rem] shadow-sm border border-[var(--sys-border)] active:scale-95 shrink-0"><${Icon} name="Trash" size=${14} /></button>`}</div>`; }):null}
                                </div>
                            </div>
                        </div>
                    `);
                }

                if (showWsModal) {
                    mList.push(html`
                        <div key="modal-ws" className="fixed inset-0 z-[9999] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-in">
                            <div className="bg-[var(--sys-solid)] rounded-[2.5rem] p-6 w-full max-w-[320px] shadow-2xl border border-[var(--sys-border)]">
                                <div className="flex justify-between items-center mb-5 border-b border-[var(--sys-border)] pb-3">
                                    <h3 className="text-[11px] font-black uppercase text-[var(--sys-text)] tracking-widest">New Map</h3>
                                    <button onClick=${function(){setShowWsModal(false);}} className="p-1.5 bg-[var(--sys-bg)] rounded-full border border-[var(--sys-border)] text-[var(--sys-muted)] hover:text-white"><${Icon} name="Close" size=${14}/></button>
                                </div>
                                <input value=${wsName} onChange=${function(e){setWsName(e.target.value);}} className="w-full bg-[var(--sys-bg)] text-[var(--sys-text)] p-4 rounded-2xl font-bold outline-none mb-6 border border-[var(--sys-border)] focus:border-[var(--sys-accent)] transition-colors" placeholder="e.g. Office, Vacation..." />
                                <div className="space-y-4 mb-8">
                                    <div className="grid grid-cols-4 gap-3 bg-[var(--sys-bg)] p-3 rounded-[1.5rem] border border-[var(--sys-border)] h-[120px] overflow-y-auto no-scrollbar">${ICONS.map(function(k){return html`<button key=${k} onClick=${function(){setWsIcon(k);}} className=${`p-3.5 rounded-xl flex items-center justify-center transition-all ${wsIcon === k ? 'bg-[var(--sys-accent)] text-white shadow-md' : 'bg-[var(--sys-solid)] text-[var(--sys-muted)] border border-[var(--sys-border)]'}`}><${Icon} name=${k} size=${20}/></button>`;})}</div>
                                    <div className="flex flex-wrap gap-3 justify-center bg-[var(--sys-bg)] p-4 rounded-[1.5rem] border border-[var(--sys-border)]">${COLOR_PALETTE.map(function(c){return html`<button key=${c} onClick=${function(){setWsColor(c);}} className=${`w-7 h-7 rounded-full ${c} ${wsColor === c ? 'ring-4 ring-[var(--sys-border)] scale-110 shadow-md' : 'opacity-40'} transition-all`} />`;})}</div>
                                </div>
                                <button onClick=${function(){if(!wsName)return; var nm={id:'ws-'+Date.now(), name:wsName, icon:wsIcon, color:wsColor, salary:0, categories:CATEGORIES, subs:[], deletedSubs:[]}; setWorkspaces(workspaces.concat([nm])); setShowWsModal(false); handleMapSelect(nm.id); setWsName(''); triggerToast("Map Created!"); }} className="w-full py-4 bg-[var(--sys-accent)] text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-lg active:scale-95 transition-all">Create Map</button>
                            </div>
                        </div>
                    `);
                }

                if (showBackupModal) {
                    mList.push(html`
                        <div key="modal-backup" className="fixed inset-0 z-[9999] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-in">
                            <div className="bg-[var(--sys-solid)] rounded-[2.5rem] p-8 w-full max-w-[320px] shadow-2xl border border-[var(--sys-border)] text-center">
                                <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5 bg-[var(--sys-accent-soft)] text-[var(--sys-accent)] border border-[var(--sys-accent)]/20"><${Icon} name="Download" size=${28} /></div>
                                <h3 className="text-2xl font-black text-[var(--sys-text)] mb-2">Backup Data</h3>
                                <p className="text-[11px] font-bold text-[var(--sys-muted)] mb-6 uppercase tracking-widest leading-relaxed">Store this encrypted file safely.</p>
                                <input value=${backupName} onChange=${function(e){setBackupName(e.target.value);}} className="w-full bg-[var(--sys-bg)] text-[var(--sys-text)] p-4 rounded-2xl font-bold outline-none mb-6 border border-[var(--sys-border)] focus:border-[var(--sys-accent)] text-center" placeholder="File Name" />
                                <div className="flex gap-3">
                                    <button onClick=${function(){setShowBackupModal(false);}} className="flex-1 py-4 bg-[var(--sys-bg)] text-[var(--sys-text)] rounded-2xl font-black text-[11px] active:scale-95 transition-all uppercase tracking-widest border border-[var(--sys-border)]">Cancel</button>
                                    <button onClick=${confirmBackup} className="flex-1 py-4 bg-[var(--sys-accent)] text-white rounded-2xl font-black text-[11px] active:scale-95 transition-all uppercase tracking-widest shadow-lg">Save</button>
                                </div>
                            </div>
                        </div>
                    `);
                }

                if (showPrint) {
                    mList.push(html`
                        <div key="modal-print" className="fixed inset-0 z-[9999] bg-[var(--sys-bg)] flex flex-col p-4 animate-in">
                            <div className="no-print p-4 bg-[var(--sys-solid)] border-b flex justify-between items-center max-w-4xl mx-auto w-full rounded-t-[2.5rem] border border-[var(--sys-border)] shadow-sm mt-4"><h3 className="font-black text-base text-[var(--sys-text)] flex items-center gap-2 ml-2"><${Icon} name="Printer" size=${18}/> Download</h3><div className="flex gap-2"><button id="pdf-btn" onClick=${downloadPDF} className="px-6 py-3.5 bg-[var(--sys-accent)] text-white rounded-xl font-black text-[11px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">Save PDF</button><button onClick=${function(){setShowPrint(false);}} className="px-6 py-3.5 bg-[var(--sys-bg)] text-[var(--sys-text)] border border-[var(--sys-border)] rounded-xl font-black text-[11px] uppercase tracking-widest active:scale-95">Close</button></div></div>
                            <div id="pdf-document-content" className="max-w-4xl mx-auto p-8 w-full bg-[var(--sys-card)] h-full overflow-y-auto border-x border-b border-[var(--sys-border)] text-[var(--sys-text)]">
                                <h1 className="text-4xl font-black tracking-tighter uppercase leading-none glow-text">OFFICIAL RECORDS</h1>
                                <p className="text-[11px] border-b-2 border-[var(--sys-text)] pb-4 mb-8 tracking-widest text-[var(--sys-muted)] uppercase mt-4">Map: ${activeWS?activeWS.name:''} | Holder: ${profile?profile.name:''} | Generated: ${new Date().toLocaleDateString()}</p>
                                <div className="grid grid-cols-4 gap-4 mb-8">
                                    <div className="p-5 bg-[var(--sys-solid)] rounded-2xl border border-[var(--sys-border)]"><p className="text-[8px] font-bold uppercase text-[var(--sys-muted)] mb-1 tracking-widest">Income</p><p className="text-xl font-black">₹${metrics.income}</p></div>
                                    <div className="p-5 bg-[var(--sys-solid)] rounded-2xl border border-[var(--sys-border)]"><p className="text-[8px] font-bold uppercase text-[var(--sys-muted)] mb-1 tracking-widest">Net Balance</p><p className="text-xl font-black text-[var(--sys-accent)]">₹${metrics.balance}</p></div>
                                    <div className="p-5 bg-[var(--sys-solid)] rounded-2xl border border-[var(--sys-border)]"><p className="text-[8px] font-bold uppercase text-[var(--sys-muted)] mb-1 tracking-widest">Spend (${selectedCat})</p><p className="text-xl font-black text-rose-400">₹${metrics.spend}</p></div>
                                    <div className="p-5 bg-[var(--sys-solid)] rounded-2xl border border-[var(--sys-border)]"><p className="text-[8px] font-bold uppercase text-[var(--sys-muted)] mb-1 tracking-widest">Reduction</p><p className="text-xl font-black text-emerald-400">₹${metrics.simSaved}</p></div>
                                </div>
                                <table className="w-full text-left border-collapse">
                                    <thead><tr className="border-b-2 border-[var(--sys-text)]"><th className="py-4 px-2 text-[10px] font-black uppercase tracking-widest text-[var(--sys-muted)]">Detail Name</th><th className="py-4 text-center text-[10px] font-black uppercase tracking-widest text-[var(--sys-muted)]">Day</th><th className="py-4 px-2 text-right text-[10px] font-black uppercase tracking-widest text-[var(--sys-muted)]">Amount</th></tr></thead>
                                    <tbody className="divide-y divide-[var(--sys-border)]">
                                        ${displaySubs.map(function(s){ return html`<tr><td className="py-4 px-2 font-bold text-sm leading-tight">${s.name || ''}<br/><span className="text-[8px] text-[var(--sys-accent)] uppercase font-black tracking-widest mt-1 inline-block">${s.cat || ''}</span><div className="mt-1.5 flex flex-wrap gap-1">${(s.fields||[]).map(function(f){ return html`<span className="text-[8px] text-[var(--sys-muted)] bg-[var(--sys-bg)] border border-[var(--sys-border)] px-2 py-1 rounded-lg mr-1 shadow-sm"><span className="uppercase opacity-60">${f.label}:</span> ${f.value}</span>`;})}</div></td><td className="py-4 text-center text-xs font-bold text-[var(--sys-muted)] uppercase">Day ${s.day || 1}</td><td className="py-4 px-2 text-right font-black text-lg">₹${(parseFloat(s.amount)||0).toLocaleString()}</td></tr>`; })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `);
                }

                return mList.length > 0 ? html`<${React.Fragment}>${mList}</${React.Fragment}>` : null;
            };

            // --- MASTER RENDER PIPELINE ---
            
            if (isAppLoading) return html`<div className="native-container justify-center items-center bg-[var(--sys-bg)] z-[500] fixed inset-0"><div className="w-24 h-24 rounded-3xl gradient-bg flex items-center justify-center shadow-[0_0_50px_rgba(99,102,241,0.5)] mb-6 animate-scale-in"><${Icon} name="LayoutGrid" size=${48} className="text-white"/></div><h1 className="text-3xl font-black tracking-tight text-[var(--sys-text)] glow-text animate-fade-up">Luminous<span className="text-[var(--sys-accent)]">Finance</span></h1></div>`;
            if (!hasSeenOnboard) return html`<${React.Fragment}>${renderOnboarding()}</${React.Fragment}>`;
            if (!profile || showProfileEdit) return html`<${React.Fragment}>${renderProfileSetup()}</${React.Fragment}>`;
            
            var viewContent = null;
            if (nav === 'dash') viewContent = renderDashboard();
            else if (nav === 'lab') viewContent = renderLab();
            else if (nav === 'calendar') viewContent = renderCalendar();
            else if (nav === 'maps') viewContent = renderMaps();
            else if (nav === 'settings') viewContent = renderSettings();
            else if (nav === 'bin') viewContent = renderBin();

            return html`
                <${ErrorBoundary}>
                    <div className="native-container bg-[var(--sys-bg)]">
                        ${renderTopNav()}
                        <div className="scroll-area" onTouchStart=${handleGlobalTouchStart} onTouchEnd=${handleGlobalTouchEnd}>
                            ${viewContent}
                        </div>
                        ${renderBottomNav()}
                        ${renderModals()}
                    </div>
                </${ErrorBoundary}>
            `;
        };

        var rootElement = document.getElementById('root');
        var root = ReactDOM.createRoot(rootElement);
        root.render(html`<${App} />`);
    </script>
</body>
</html>
