<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bill Map | Ultra Stable</title>
    		
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #F8FAFC; 
            color: #0F172A; 
            margin: 0; padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
        }

        /* Prevent iPhone Auto-Zoom */
        input, select, textarea { font-size: 16px !important; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media print { 
            .no-print { display: none !important; } 
            body { background: white !important; } 
        }

        /* Animations */
        @keyframes zap-pulse { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }
        .zap-glow { animation: zap-pulse 2s infinite; }
        
        @keyframes fade-in-out { 0% { opacity: 0; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
        .splash-logo { animation: fade-in-out 2.5s forwards; }
        
        .main-content { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .bill-focus { animation: highlight-pulse 2s ease-in-out; }
        @keyframes highlight-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); border: 2px solid #4f46e5; } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const html = htm.bind(React.createElement);

        // --- Hardcoded SVG Components ---
        const Icon = function(props) {
            const name = props.name;
            const size = props.size || 18;
            const paths = {
                Plus: html`<path d="M12 5v14M5 12h14" />`,
                Trash: html`<path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />`,
                Edit: html`<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 00 2 2h14a2 2 0 00 2-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />`,
                Zap: html`<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />`,
                Printer: html`<path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6v-8z" />`,
                Calendar: html`<path d="M3 4h18v16H3V4zM16 2v4M8 2v4M3 10h18" />`,
                Grid: html`<path d="M3 3h7v7H3V3zM14 3h7v7h-7V3zM14 14h7v7h-7v-14zM3 14h7v7H3v-7z" />`,
                List: html`<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />`,
                Close: html`<path d="M18 6L6 18M6 6l12 12" />`,
                Check: html`<path d="M20 6L9 17l-5-5" />`,
                Alert: html`<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01" />`,
                CreditCard: html`<rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><path d="M1 10h22" />`,
                Home: html`<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10" />`,
                Clock: html`<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" />`,
                Heart: html`<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />`
            };
            return html`
                <svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" className=${props.className || ""}>
                    ${paths[name] || null}
                </svg>
            `;
        };

        const PRESET_KEYS = ["End Date", "Note", "Account ID", "Policy Number", "Renewal Type"];
        const COLOR_PALETTE = ["bg-indigo-600", "bg-rose-500", "bg-emerald-500", "bg-sky-500", "bg-amber-500", "bg-purple-600", "bg-slate-800"];
        const ICON_LIST = ["Home", "Zap", "CreditCard", "Calendar", "Clock"];

        const App = function() {
            const [isAppLoading, setIsAppLoading] = React.useState(true);
            const [userName, setUserName] = React.useState("My Notes");
            const [categories, setCategories] = React.useState(["Essentials", "Leisure", "Work"]);
            const [subs, setSubs] = React.useState([]);
            const [view, setView] = React.useState('board');
            const [selectedCat, setSelectedCat] = React.useState('All');
            const [isSimulating, setIsSimulating] = React.useState(false);
            const [cutIds, setCutIds] = React.useState([]);
            const [modal, setModal] = React.useState(null);
            const [showPrint, setShowPrint] = React.useState(false);
            const [zapPopup, setZapPopup] = React.useState(false);
            const [calPopup, setCalPopup] = React.useState(null);
            const [focusedId, setFocusedId] = React.useState(null);

            React.useEffect(function() {
                const timer = setTimeout(function() { setIsAppLoading(false); }, 2500);
                const saved = localStorage.getItem('sublattice_v80_final');
                if (saved) {
                    const d = JSON.parse(saved);
                    setSubs(d.subs || []);
                    setCategories(d.categories || ["Essentials", "Leisure", "Work"]);
                    setUserName(d.userName || "My Notes");
                } else {
                    setSubs([{ id: '1', name: 'Home EMI', amount: 45000, cat: 'Essentials', day: 5, icon: 'Home', color: 'bg-indigo-600', isAutoPay: true, fields: [] }]);
                }
                return function() { clearTimeout(timer); };
            }, []);

            React.useEffect(function() { 
                localStorage.setItem('sublattice_v80_final', JSON.stringify({ subs: subs, categories: categories, userName: userName })); 
            }, [subs, categories, userName]);

            const metrics = React.useMemo(function() {
                const active = subs.filter(function(s) { return cutIds.indexOf(s.id) === -1; });
                const total = active.reduce(function(acc, curr) { return acc + (parseFloat(curr.amount) || 0); }, 0);
                const saved = isSimulating ? subs.filter(function(s) { return cutIds.indexOf(s.id) !== -1; }).reduce(function(acc, curr) { return acc + (parseFloat(curr.amount) || 0); }, 0) : 0;
                return { total: total, daily: (total / 30).toFixed(0), saved: saved };
            }, [subs, cutIds, isSimulating]);

            const filteredSubs = subs.filter(function(s) { return selectedCat === 'All' || s.cat === selectedCat; });

            const navigateToBill = function(id) {
                setView('board');
                setSelectedCat('All');
                setCalPopup(null);
                setZapPopup(false);
                setFocusedId(id);
                setTimeout(function() {
                    const el = document.getElementById('bill-' + id);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setTimeout(function() { setFocusedId(null); }, 3000);
                }, 200);
            };

            const handleSave = function(u) {
                if (!u.name) return;
                let newCats = categories;
                if (categories.indexOf(u.cat) === -1) {
                    newCats = categories.concat([u.cat]);
                    setCategories(newCats);
                }
                if (u.id) {
                    setSubs(subs.map(function(s) { return s.id === u.id ? u : s; }));
                } else {
                    const newSub = Object.assign({}, u, { id: Date.now().toString() });
                    setSubs(subs.concat([newSub]));
                }
                setModal(null);
            };

            const getStatus = function(sub) {
                const today = new Date().getDate();
                if (sub.isAutoPay) {
                    if (today >= sub.day && today <= sub.day + 5) return { label: 'Paid', color: 'text-emerald-600 bg-emerald-50', icon: 'Check' };
                    return { label: 'Auto', color: 'text-indigo-600 bg-indigo-50', icon: 'Zap' };
                } else {
                    if (today >= sub.day - 5 && today <= sub.day) return { label: 'Due', color: 'text-rose-600 bg-rose-50 animate-pulse', icon: 'Alert' };
                    return { label: 'Manual', color: 'text-slate-400 bg-slate-100', icon: 'Clock' };
                }
            };

            if (isAppLoading) {
                return html`
                    <div className="fixed inset-0 bg-indigo-600 flex items-center justify-center z-[500]">
                        <div className="flex flex-col items-center splash-logo text-white">
                            <${Icon} name="CreditCard" size=${70} />
                            <h1 className="text-3xl font-extrabold mt-6 tracking-tighter">My Bill Map</h1>
                            <p className="text-indigo-200 text-[10px] font-bold uppercase tracking-[0.2em] mt-2">v1.0 Architect Stable</p>
                        </div>
                    </div>
                `;
            }

            return html`
                <div className="min-h-screen pb-40">
                    <header className="max-w-6xl mx-auto px-5 py-6 flex justify-between items-center no-print">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg"><${Icon} name="CreditCard" size=${20} /></div>
                            <div><h1 className="text-lg font-black tracking-tight text-slate-800 leading-none">My Bill Map</h1><input value=${userName} onChange=${e => setUserName(e.target.value)} className="text-[10px] font-bold text-slate-400 bg-transparent border-none p-0 focus:ring-0 uppercase tracking-widest mt-1 w-32" /></div>
                        </div>
                        <button onClick=${function() { setShowPrint(true); }} className="p-3 bg-white border border-slate-200 rounded-2xl text-slate-400 hover:text-indigo-600 shadow-sm"><${Icon} name="Printer" size=${18} /></button>
                    </header>

                    <main className="max-w-6xl mx-auto px-5 space-y-6 no-print">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Monthly Summary</span>
                                <div className="flex items-baseline gap-2 mt-1"><h2 className="text-2xl font-bold">₹${metrics.total.toLocaleString()}</h2>${isSimulating && metrics.saved > 0 && html`<div className="text-emerald-600 text-[9px] font-black bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 uppercase">Save ₹${metrics.saved.toLocaleString()}</div>`}</div>
                            </div>
                            <div className="bg-indigo-600 p-4 rounded-3xl text-white shadow-lg"><span className="text-[10px] font-medium text-indigo-100 uppercase tracking-widest block">Daily Cost</span><h2 className="text-2xl font-bold mt-1 tracking-tight">₹${metrics.daily}</h2></div>
                            <div className="bg-white p-4 rounded-3xl border border-slate-200 flex flex-col justify-between relative overflow-visible shadow-sm">
                                <div className="flex items-center justify-between"><span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest tracking-tight">Reduction Lab</span>
                                    <div className="relative"><button onClick=${function() { if(isSimulating) setZapPopup(!zapPopup); }} className=${`p-2.5 rounded-full transition-all ${isSimulating ? 'bg-amber-100 text-amber-500 zap-glow' : 'bg-slate-100 text-slate-300'}`}>
                                        <${Icon} name="Zap" size=${18} />${isSimulating && cutIds.length > 0 && html`<span className="absolute -top-1 -right-1 w-4 h-4 bg-amber-500 text-white text-[8px] font-black flex items-center justify-center rounded-full border-2 border-white">${cutIds.length}</span>`}</button>
                                        ${zapPopup && isSimulating && html`<div className="absolute bottom-full right-0 mb-4 w-56 bg-slate-900 text-white rounded-2xl p-4 shadow-2xl z-50 animate-in zoom-in-95">
                                            <div className="flex justify-between items-center mb-2 border-b border-white/10 pb-1"><span className="text-[9px] font-black text-amber-400 uppercase">Removing</span><button onClick=${function() { setZapPopup(false); }}><${Icon} name="Close" size=${10}/></button></div>
                                            <div className="space-y-1 max-h-32 overflow-y-auto no-scrollbar">${subs.filter(function(s) { return cutIds.indexOf(s.id) !== -1; }).map(function(s) { return html`<div key=${s.id} onClick=${function() { navigateToBill(s.id); }} className="flex justify-between items-center py-2 text-[10px] border-b border-white/5 active:bg-white/10 rounded px-1">
                                                <div className="flex items-center gap-2"><div className=${`p-1 rounded-sm ${s.color} text-white shadow-sm shrink-0`}><${Icon} name=${s.icon} size=${8}/></div> <span>${s.name}</span></div>
                                                <button onClick=${function(e) { e.stopPropagation(); setCutIds(cutIds.filter(function(cid){ return cid !== s.id; })); }} className="p-1.5"><${Icon} name="Trash" size=${14} className="text-rose-400"/></button>
                                            </div>`; })}</div><div className="absolute top-full right-4 border-[8px] border-transparent border-t-slate-900"></div></div>`}
                                    </div>
                                </div>
                                <button onClick=${function() { setIsSimulating(!isSimulating); setCutIds([]); setZapPopup(false); }} className=${`w-full py-1.5 rounded-xl text-[10px] font-bold mt-2 ${isSimulating ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600'}`}>${isSimulating ? 'Stop Test' : 'Test Cuts'}</button>
                            </div>
                        </div>

                        <div className="flex flex-col md:flex-row items-center justify-between gap-4 bg-white p-2 rounded-2xl border border-slate-200 sticky top-4 z-40 shadow-sm">
                            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar w-full md:w-auto px-1">
                                <button onClick=${function() { setSelectedCat('All'); }} className=${`px-4 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap transition-all ${selectedCat === 'All' ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-400'}`}>All Records</button>
                                ${categories.map(function(c) { return html`<button key=${c} onClick=${function() { setSelectedCat(c); }} className=${`px-4 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap transition-all ${selectedCat === c ? 'bg-slate-900 text-white shadow-md' : 'bg-slate-50 text-slate-400'}`}>${c}</button>`; })}
                            </div>
                            <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl shrink-0">
                                <button onClick=${function() { setView('board'); }} className=${`p-2 rounded-lg ${view === 'board' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}><${Icon} name="Grid" size=${14}/></button>
                                <button onClick=${function() { setView('list'); }} className=${`p-2 rounded-lg ${view === 'list' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}><${Icon} name="List" size=${14}/></button>
                                <button onClick=${function() { setView('calendar'); }} className=${`p-2 rounded-lg ${view === 'calendar' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}><${Icon} name="Calendar" size=${14}/></button>
                            </div>
                        </div>

                        ${view === 'board' && html`<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${filteredSubs.map(function(sub) {
                            const stat = getStatus(sub); const isP = cutIds.indexOf(sub.id) !== -1;
                            return html`<div key=${sub.id} id=${'bill-' + sub.id} onClick=${function() { if(isSimulating) { if(isP) setCutIds(cutIds.filter(function(i){ return i !== sub.id })); else setCutIds(cutIds.concat(sub.id)); } }}
                                className=${`group relative bg-white p-5 rounded-[2.5rem] border-2 transition-all cursor-pointer ${focusedId === sub.id ? 'bill-focus ring-2 ring-indigo-500' : ''} ${isP && isSimulating ? 'opacity-40 grayscale border-dashed' : 'border-transparent shadow-sm'}`}>
                                <div className=${`absolute top-4 right-4 px-2 py-1 rounded-lg flex items-center gap-1 ${stat.color}`}><${Icon} name=${stat.icon} size=${10}/><span className="text-[8px] font-bold uppercase tracking-widest leading-none">${stat.label}</span></div>
                                <div className="flex items-center gap-3 mb-6"><div className=${`p-3 rounded-2xl ${sub.color} text-white shadow-sm`}><${Icon} name=${sub.icon} size=${18}/></div><div><h4 className="font-bold text-sm text-slate-800 leading-tight">${sub.name}</h4><p className="text-[9px] font-bold text-slate-300 uppercase">${sub.cat}</p></div></div>
                                <div className="flex items-end justify-between"><div><span className="text-xl font-bold tracking-tight text-slate-900">₹${sub.amount.toLocaleString()}</span><p className="text-[8px] font-bold text-slate-400 uppercase mt-1">Recur Day ${sub.day}</p></div>
                                <div className="flex flex-col items-end gap-1">${sub.fields && sub.fields.map(function(f, i) { return html`<div key=${i} className="text-[8px] font-bold text-slate-400 bg-slate-50 px-1.5 py-0.5 rounded border border-slate-100"><span>${f.label}: </span><span className="text-slate-600">${f.value}</span></div>`; })}</div></div>
                                <div className="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-4 opacity-0 group-hover:opacity-100 transition-all scale-95 group-hover:scale-100"><button onClick=${function(e) {e.stopPropagation(); setModal(sub);}} className="p-3 bg-white text-blue-600 rounded-full shadow-xl border border-blue-50 hover:scale-110 active:scale-95 transition-all"><${Icon} name="Edit" size=${16}/></button><button onClick=${function(e) {e.stopPropagation(); setSubs(subs.filter(function(s){return s.id!==sub.id;}));}} className="p-3 bg-white text-rose-600 rounded-full shadow-xl border border-rose-50 hover:scale-110 active:scale-95 transition-all"><${Icon} name="Trash" size=${16}/></button></div>
                            </div>`;
                        })}</div>`}

                        ${view === 'list' && html`<div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                            <table className="w-full text-left table-fixed">
                                <thead className="bg-slate-50 border-b"><tr><th className="w-[35%] px-4 py-4 text-[9px] font-bold uppercase tracking-widest">Detail</th><th className="w-[15%] px-2 py-4 text-center text-[9px] font-bold uppercase">Day</th><th className="w-[50%] px-4 py-4 text-right text-[9px] font-bold uppercase">Note & Cost</th></tr></thead>
                                <tbody className="divide-y divide-slate-50">${filteredSubs.map(function(s) { return html`<tr key=${s.id} onClick=${function() { setModal(s); }} className="hover:bg-slate-50/50 cursor-pointer"><td className="px-4 py-3"><div className="flex items-center gap-2 overflow-hidden"><div className=${`p-1.5 rounded-lg ${s.color} text-white shrink-0 shadow-sm`}><${Icon} name=${s.icon} size=${10}/></div><span className="font-bold text-[11px] truncate text-slate-800">${s.name}</span></div></td><td className="px-2 py-3 text-center text-[10px] text-slate-400 font-bold">${s.day}</td><td className="px-4 py-3 text-right"><div className="flex flex-col items-end"><span className="font-bold text-indigo-600 text-xs">₹${s.amount.toLocaleString()}</span><div className="flex flex-wrap justify-end gap-1 mt-1">${s.fields && s.fields.slice(0,1).map(function(f){ return html`<span className="text-[7px] text-slate-400 font-black uppercase truncate bg-slate-50 px-1 py-0.5 rounded border border-slate-100">${f.label}: ${f.value}</span>`; })}</div></div></td></tr>`; })}</tbody>
                            </table>
                        </div>`}

                        ${view === 'calendar' && html`<div className="grid grid-cols-1 lg:grid-cols-4 gap-6 pb-10"><div className="lg:col-span-3 bg-white p-6 rounded-[2.5rem] border border-slate-200 relative shadow-sm overflow-visible"><div className="grid grid-cols-7 gap-2">
                            ${['S','M','T','W','T','F','S'].map(function(d) { return html`<div key=${d} className="text-center text-[10px] font-bold text-slate-300 py-3 uppercase">${d}</div>`; })}
                            ${Array.from({ length: 31 }, function(_, i) { return i + 1; }).map(function(d) { const dSubs = subs.filter(function(s) { return s.day === d; });
                                return html`<div key=${d} onClick=${function() { if(dSubs.length) setCalPopup(d); }} className=${`aspect-square border-2 rounded-2xl p-1 relative flex flex-col transition-all cursor-pointer ${dSubs.length ? 'bg-indigo-50 border-indigo-100 shadow-sm' : 'border-slate-50'}`}>
                                    <span className="text-[10px] font-bold text-slate-300">${d}</span><div className="flex gap-0.5 mt-auto flex-wrap">${dSubs.map(function(s) { return html`<div key=${s.id} className=${`w-1.5 h-1.5 rounded-full ${s.color}`} />`; })}</div>
                                    ${calPopup === d && html`<div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-4 w-48 bg-slate-900 text-white rounded-2xl p-4 shadow-2xl z-50 animate-in zoom-in-95">
                                        <div className="flex justify-between items-center mb-2 border-b border-white/10 pb-1"><span className="text-[9px] font-black uppercase text-indigo-400">Day ${d} Notes</span><button onClick=${function(e){e.stopPropagation(); setCalPopup(null);}}><${Icon} name="Close" size=${10}/></button></div>
                                        <div className="space-y-1">${dSubs.map(function(s) { return html`<div key=${s.id} onClick=${function() { navigateToBill(s.id); }} className="flex justify-between text-[10px] items-center py-2 active:bg-white/10 px-1 rounded transition-colors cursor-pointer">
                                            <div className="flex items-center gap-2"><div className=${`p-1 rounded-sm ${s.color} text-white shadow-sm shrink-0`}><${Icon} name=${s.icon} size=${8} /></div> <span className="truncate w-20">${s.name}</span></div>
                                            <span className="font-bold text-xs">₹${s.amount}</span>
                                        </div>`; })}</div><div className="absolute top-full left-1/2 -translate-x-1/2 border-[8px] border-transparent border-t-slate-900"></div></div>`}
                                </div>`;
                            })}</div></div>
                            <div className="bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm space-y-4 h-fit"><h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-50 pb-3">Coming Up Next</h4>
                                <div className="space-y-2 max-h-64 overflow-y-auto no-scrollbar">${subs.sort(function(a,b){return a.day-b.day;}).map(function(s) { return html`<div key=${s.id} onClick=${function() { navigateToBill(s.id); }} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl active:bg-slate-100 transition-all cursor-pointer"><div className="flex items-center gap-3"><div className=${`p-1.5 rounded-lg ${s.color} text-white shadow-sm shrink-0`}><${Icon} name=${s.icon} size=${12}/></div><span className="text-[11px] font-bold text-slate-700 truncate w-24">${s.name}</span></div><span className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Day ${s.day}</span></div>`; })}</div>
                            </div></div>`}

                        <div className="py-20 text-center opacity-30 flex flex-col items-center"><${Icon} name="Heart" size=${16} className="text-rose-500 fill-rose-500 mb-2" /><p className="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-500">Built with love for you</p></div>
                    </main>

                    ${modal && html`<div className="fixed inset-0 z-[200] bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-[325px] rounded-[2.5rem] shadow-2xl overflow-hidden border-[6px] border-white my-auto animate-in zoom-in-95">
                            <div className="p-4 bg-slate-50 border-b flex justify-between items-center shrink-0"><h3 className="text-sm font-black uppercase tracking-widest text-slate-800">Record Note</h3><button onClick=${function() { setModal(null); }} className="p-1"><${Icon} name="Close" size=${20} className="text-slate-400" /></button></div>
                            <div className="p-4 space-y-4 max-h-[75vh] overflow-y-auto no-scrollbar">
                                <div className="space-y-3">
                                    <div><label className="text-[9px] font-bold uppercase text-slate-400 ml-1">Name</label><input value=${modal.name} onChange=${e => setModal(Object.assign({}, modal, {name: e.target.value}))} className="w-full bg-slate-100 rounded-xl px-3 py-2.5 font-bold outline-none text-base border-2 border-transparent focus:border-indigo-100" placeholder="Netflix, Rent..." /></div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="text-[9px] font-bold uppercase text-slate-400 ml-1">Amount</label><input type="number" value=${modal.amount || ""} onChange=${e => setModal(Object.assign({}, modal, {amount: e.target.value}))} className="w-full bg-slate-100 rounded-xl px-3 py-2.5 font-bold outline-none text-base" placeholder="₹" /></div>
                                        <div><label className="text-[9px] font-bold uppercase text-slate-400 ml-1">Date</label><input type="date" value=${modal.rawDate || ""} className="w-full bg-slate-100 rounded-xl px-2 py-2.5 font-bold outline-none text-[10px]" onChange=${e => { if(e.target.value) { const d = new Date(e.target.value); setModal(Object.assign({}, modal, {day: d.getDate(), rawDate: e.target.value})); } }} /></div>
                                    </div>
                                </div>
                                <div className="p-3 bg-indigo-50 rounded-xl flex justify-between items-center"><span className="text-[10px] font-black uppercase text-indigo-900">Auto-Pay</span><button onClick=${function() { setModal(Object.assign({}, modal, {isAutoPay: !modal.isAutoPay})); }} className=${`px-4 py-1.5 rounded-lg text-[9px] font-black ${modal.isAutoPay ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white border-2'}`}>${modal.isAutoPay ? 'ON' : 'OFF'}</button></div>
                                
                                <div className="space-y-3 pt-3 border-t border-slate-100"><label className="text-[9px] font-black uppercase text-slate-400 block text-center">Visuals</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="grid grid-cols-4 gap-1 bg-slate-50 p-1.5 rounded-xl">${ICON_LIST.map(function(k) { return html`<button key=${k} onClick=${function() { setModal(Object.assign({}, modal, {icon: k})); }} className=${`p-1.5 rounded-lg flex items-center justify-center transition-all ${modal.icon === k ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-300'}`}><${Icon} name=${k} size=${10}/></button>`; })}</div>
                                        <div className="flex flex-col gap-1.5">
                                            ${modal.isCustomMode ? html`<input autoFocus className="w-full bg-white border-2 border-indigo-200 rounded-xl px-2 py-2 text-[9px] font-bold" placeholder="Label..." onBlur=${function(e) { if(e.target.value) setModal(Object.assign({}, modal, {cat: e.target.value, isCustomMode: false})); else setModal(Object.assign({}, modal, {isCustomMode: false})); }} />` : html`<select value=${modal.cat} onChange=${function(e) { if(e.target.value === 'NEW') setModal(Object.assign({}, modal, {isCustomMode: true})); else setModal(Object.assign({}, modal, {cat: e.target.value})); }} className="w-full bg-slate-100 rounded-xl px-2 py-2 text-[9px] font-black uppercase outline-none shadow-sm">${categories.map(function(c){ return html`<option key=${c} value=${c}>${c}</option>`; })}<option value="NEW">+ Custom...</option></select>`}
                                            <div className="flex flex-wrap gap-1 justify-center">${COLOR_PALETTE.map(function(c) { return html`<button key=${c} onClick=${function() { setModal(Object.assign({}, modal, {color: c})); }} className=${`w-4 h-4 rounded-full ${c} ${modal.color === c ? 'ring-2 ring-indigo-200 shadow-sm' : 'opacity-40'}`} />`; })}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-2 pt-3 border-t border-slate-100"><div className="flex justify-between items-center"><span className="text-[9px] font-black uppercase text-slate-400">Notes</span><button onClick=${function() { setModal(Object.assign({}, modal, {fields: (modal.fields || []).concat({label: 'Note', value: '', isCustom: false})})); }} className="text-indigo-600 text-[9px] font-bold bg-indigo-50 px-2 py-1 rounded shadow-sm">+ Row</button></div>
                                    ${modal.fields && modal.fields.map(function(f, i) { return html`<div key=${i} className="flex gap-2 bg-slate-50 p-2 rounded-xl border border-slate-100 items-center">
                                        <select value=${f.isCustom ? "Custom" : f.label} onChange=${function(e) { const n = JSON.parse(JSON.stringify(modal.fields)); if(e.target.value === "Custom") { n[i].isCustom = true; n[i].label = ""; } else { n[i].isCustom = false; n[i].label = e.target.value; } setModal(Object.assign({}, modal, {fields: n})); }} className="w-[30%] bg-white rounded-lg px-1 py-1 text-[8px] font-bold border outline-none">${PRESET_KEYS.map(function(pk){ return html`<option value=${pk}>${pk}</option>`; })}<option value="Custom">Other</option></select>
                                        ${f.isCustom ? html`<input autoFocus className="w-[30%] bg-white rounded-lg px-1 py-1 text-[8px] font-bold border" placeholder="Key..." value=${f.label} onChange=${function(e) { const n = JSON.parse(JSON.stringify(modal.fields)); n[i].label = e.target.value; setModal(Object.assign({}, modal, {fields: n})); }} />` : null}
                                        <input value=${f.value} onChange=${function(e) { const n = JSON.parse(JSON.stringify(modal.fields)); n[i].value = e.target.value; setModal(Object.assign({}, modal, {fields: n})); }} className="flex-1 bg-white rounded-lg px-1.5 py-1.5 text-[8px] font-bold border" placeholder="Info" />
                                        <button onClick=${function() { setModal(Object.assign({}, modal, {fields: modal.fields.filter(function(_, idx){ return idx !== i; })})); }} className="p-1"><${Icon} name="Trash" size=${14} className="text-rose-400" /></button>
                                    </div>`; })}
                                </div>
                                <button onClick=${function() { handleSave(modal); }} className="w-full font-black py-4 bg-indigo-600 text-white rounded-[1.5rem] shadow-xl text-base active:scale-95 transition-all shadow-indigo-100">${modal.id ? "Update Note" : "Save Note"}</button>
                            </div></div></div>`}

                    ${showPrint && html`<div className="fixed inset-0 z-[300] bg-slate-900/95 flex flex-col p-4 no-print overflow-hidden"><div className="max-w-4xl mx-auto w-full flex-1 flex flex-col border rounded-[3rem] overflow-hidden bg-white shadow-2xl">
                        <div className="p-6 bg-slate-50 border-b flex justify-between items-center shrink-0"><h3 className="font-bold flex items-center gap-2">Report Summary</h3><div className="flex gap-2"><button onClick=${function() { window.print(); }} className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold text-[10px] shadow-lg active:scale-95 transition-all">Print PDF</button><button onClick=${function() { setShowPrint(false); }} className="p-2 bg-slate-100 rounded-xl active:bg-slate-200 transition-all"><${Icon} name="Close" size=${18} /></button></div></div>
                        <div className="flex-1 overflow-y-auto p-10 bg-white"><h1 className="text-2xl font-black text-slate-900 tracking-tighter">RECORDS STATEMENT</h1><p className="text-[10px] border-b pb-4 mb-8 tracking-widest text-slate-500 uppercase underline decoration-indigo-200 underline-offset-4">Holder: ${userName}</p>
                            <div className="grid grid-cols-2 gap-4 mb-10"><div className="p-6 bg-slate-50 rounded-2xl border text-center"><p className="text-[8px] font-bold uppercase opacity-50 tracking-[0.2em] mb-1">Total Commit</p><p className="text-2xl font-black">₹${metrics.total.toLocaleString()}</p></div><div className="p-6 bg-slate-50 rounded-2xl border text-center"><p className="text-[8px] font-bold uppercase opacity-50 tracking-[0.2em] mb-1">Daily Burn</p><p className="text-2xl font-black text-indigo-600">₹${metrics.daily}</p></div></div>
                            <table className="w-full text-left"><thead><tr className="bg-slate-50 border-b-2 border-slate-900"><th className="py-4 px-2 text-[9px] font-black uppercase">Service Identity</th><th className="py-4 text-center text-[9px] font-black uppercase">Pay Day</th><th className="py-4 px-2 text-right text-[9px] font-black uppercase">Amount</th></tr></thead>
                            <tbody>${subs.map(function(s) { return html`<tr key=${s.id} className="border-b"><td className="py-4 px-2 font-bold text-sm text-slate-800">${s.name}<br/><span className="text-[7px] text-indigo-600 uppercase font-black tracking-[0.1em]">${s.cat}</span></td><td className="py-4 text-center text-xs font-bold text-slate-400">Day ${s.day}</td><td className="py-4 px-2 text-right font-black text-sm">₹${s.amount.toLocaleString()}</td></tr>`; })}</tbody></table>
                        </div></div></div>`}

                    <button onClick=${function() { setModal({ name: '', amount: '', day: 1, cat: categories[0], icon: 'Home', color: 'bg-indigo-600', isAutoPay: false, fields: [] }); }} 
                        className="fixed bottom-10 right-8 w-16 h-16 bg-indigo-600/80 backdrop-blur-md text-white rounded-[2rem] shadow-2xl flex items-center justify-center z-40 no-print active:scale-95 transition-all shadow-indigo-200">
                        <${Icon} name="Plus" size=${28} />
                    </button>
                </div>
            `;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
