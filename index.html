<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bill Map | Pro Native</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        input, select, textarea, button { font-size: 16px !important; outline: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @media print { .no-print { display: none !important; } body { background: white !important; } }
        
        @keyframes zap-pulse { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }
        .zap-glow { animation: zap-pulse 2s infinite; }
        
        @keyframes fade-in-out { 0% { opacity: 0; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
        .splash-logo { animation: fade-in-out 2s forwards; }
        
        .main-content { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .bill-focus { border: 2px solid #4f46e5 !important; box-shadow: 0 0 20px rgba(79, 70, 229, 0.2) !important; transform: scale(1.02); }
        .slide-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        var html = htm.bind(React.createElement);

        var Icon = function(props) {
            var n = props.name;
            var s = props.size || 18;
            var c = props.className || "";
            var w = n === 'Check' ? "3" : "2.2";
            var pData = "";

            if (n === 'Plus') pData = html`<path d="M12 5v14M5 12h14" />`;
            else if (n === 'Trash') pData = html`<polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />`;
            else if (n === 'Edit') pData = html`<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 00 2 2h14a2 2 0 00 2-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />`;
            else if (n === 'Zap') pData = html`<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />`;
            else if (n === 'Printer') pData = html`<path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6v-8z" />`;
            else if (n === 'Calendar') pData = html`<path d="M3 4h18v16H3V4zM16 2v4M8 2v4M3 10h18" />`;
            else if (n === 'Grid') pData = html`<path d="M3 3h7v7H3V3zM14 3h7v7h-7V3zM14 14h7v7h-7v-14zM3 14h7v7H3v-7z" />`;
            else if (n === 'List') pData = html`<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />`;
            else if (n === 'Close') pData = html`<path d="M18 6L6 18M6 6l12 12" />`;
            else if (n === 'Check') pData = html`<path d="M20 6L9 17l-5-5" />`;
            else if (n === 'Alert') pData = html`<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01" />`;
            else if (n === 'CreditCard') pData = html`<rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><path d="M1 10h22" />`;
            else if (n === 'Home') pData = html`<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10" />`;
            else if (n === 'Clock') pData = html`<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" />`;
            else if (n === 'Back') pData = html`<path d="M19 12H5M12 19l-7-7 7-7" />`;
            else if (n === 'Sort') pData = html`<path d="M3 6h18M3 12h12M3 18h6" />`;
            else if (n === 'Briefcase') pData = html`<rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16" />`;
            else if (n === 'Heart') pData = html`<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />`;
            else if (n === 'Star') pData = html`<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />`;
            else if (n === 'User') pData = html`<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />`;
            else if (n === 'UserCheck') pData = html`<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><polyline points="17 11 19 13 23 9" />`;
            else if (n === 'Smile') pData = html`<circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2" /><line x1="9" y1="9" x2="9.01" y2="9" /><line x1="15" y1="9" x2="15.01" y2="9" />`;
            else if (n === 'Search') pData = html`<circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />`;
            else if (n === 'Eye') pData = html`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />`;
            else if (n === 'RotateCcw') pData = html`<polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />`;
            else if (n === 'Archive') pData = html`<polyline points="21 8 21 21 3 21 3 8" /><rect x="1" y="3" width="22" height="5" /><line x1="10" y1="12" x2="14" y2="12" />`;
            else if (n === 'Download') pData = html`<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />`;
            else if (n === 'Upload') pData = html`<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />`;

            return html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${w} strokeLinecap="round" strokeLinejoin="round" className=${c}>${pData}</svg>`;
        };

        var PRESET_KEYS = ["End Date", "Policy #", "Account ID", "Customer ID"];
        var COLOR_PALETTE = ["bg-indigo-600", "bg-rose-500", "bg-emerald-500", "bg-sky-500", "bg-amber-500", "bg-purple-600", "bg-slate-800"];
        var TEXT_COLORS = ["text-indigo-600", "text-rose-500", "text-emerald-500", "text-sky-500", "text-amber-500", "text-slate-800"];
        var ICON_LIST = ["Home", "Zap", "CreditCard", "Briefcase", "Calendar", "Clock"];
        var PROFILE_ICONS = ["User", "Briefcase", "UserCheck", "Smile", "Star"];

        var THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;

        var App = function() {
            var stateIsAppLoading = React.useState(true); var isAppLoading = stateIsAppLoading[0]; var setIsAppLoading = stateIsAppLoading[1];
            var stateWorkspaces = React.useState([]); var workspaces = stateWorkspaces[0]; var setWorkspaces = stateWorkspaces[1];
            var stateActiveId = React.useState(null); var activeId = stateActiveId[0]; var setActiveId = stateActiveId[1];
            
            var stateHasSeenOnboard = React.useState(localStorage.getItem('sl_onboard_v12') === 'true'); var hasSeenOnboard = stateHasSeenOnboard[0]; var setHasSeenOnboard = stateHasSeenOnboard[1];
            var stateOnboardStep = React.useState(0); var onboardStep = stateOnboardStep[0]; var setOnboardStep = stateOnboardStep[1];
            
            var savedProfile = localStorage.getItem('sl_profile_v12');
            var stateProfile = React.useState(savedProfile ? JSON.parse(savedProfile) : null); var profile = stateProfile[0]; var setProfile = stateProfile[1];
            var stateProfDraft = React.useState({ salutation: 'Mr.', name: '', icon: 'User', color: 'text-indigo-600' }); var profDraft = stateProfDraft[0]; var setProfDraft = stateProfDraft[1];
            var stateShowProfileEdit = React.useState(false); var showProfileEdit = stateShowProfileEdit[0]; var setShowProfileEdit = stateShowProfileEdit[1];

            var stateHomeView = React.useState('grid'); var homeView = stateHomeView[0]; var setHomeView = stateHomeView[1];
            var stateShowWsModal = React.useState(false); var showWsModal = stateShowWsModal[0]; var setShowWsModal = stateShowWsModal[1];
            var stateWsName = React.useState(""); var wsName = stateWsName[0]; var setWsName = stateWsName[1];
            var stateWsIcon = React.useState("Briefcase"); var wsIcon = stateWsIcon[0]; var setWsIcon = stateWsIcon[1];
            var stateWsColor = React.useState("bg-indigo-600"); var wsColor = stateWsColor[0]; var setWsColor = stateWsColor[1];

            var stateView = React.useState('board'); var view = stateView[0]; var setView = stateView[1];
            var stateSelectedCat = React.useState('All'); var selectedCat = stateSelectedCat[0]; var setSelectedCat = stateSelectedCat[1];
            var stateSortBy = React.useState('date_asc'); var sortBy = stateSortBy[0]; var setSortBy = stateSortBy[1];
            var stateSearchQuery = React.useState(''); var searchQuery = stateSearchQuery[0]; var setSearchQuery = stateSearchQuery[1];
            
            var stateIsSimulating = React.useState(false); var isSimulating = stateIsSimulating[0]; var setIsSimulating = stateIsSimulating[1];
            var stateCutIds = React.useState([]); var cutIds = stateCutIds[0]; var setCutIds = stateCutIds[1];
            
            var stateModal = React.useState(null); var modal = stateModal[0]; var setModal = stateModal[1];
            var stateQuickLook = React.useState(null); var quickLook = stateQuickLook[0]; var setQuickLook = stateQuickLook[1];
            var stateShowPrint = React.useState(false); var showPrint = stateShowPrint[0]; var setShowPrint = stateShowPrint[1];
            var stateZapPopup = React.useState(false); var zapPopup = stateZapPopup[0]; var setZapPopup = stateZapPopup[1];
            var stateCalPopup = React.useState(null); var calPopup = stateCalPopup[0]; var setCalPopup = stateCalPopup[1];
            var stateFocusedId = React.useState(null); var focusedId = stateFocusedId[0]; var setFocusedId = stateFocusedId[1];
            
            var stateDeleteWsId = React.useState(null); var deleteWsId = stateDeleteWsId[0]; var setDeleteWsId = stateDeleteWsId[1];
            var statePermDeleteWsId = React.useState(null); var permDeleteWsId = statePermDeleteWsId[0]; var setPermDeleteWsId = statePermDeleteWsId[1];
            var stateDeleteNoteId = React.useState(null); var deleteNoteId = stateDeleteNoteId[0]; var setDeleteNoteId = stateDeleteNoteId[1];
            var statePermDeleteNoteId = React.useState(null); var permDeleteNoteId = statePermDeleteNoteId[0]; var setPermDeleteNoteId = statePermDeleteNoteId[1];
            
            var stateIsScrolled = React.useState(false); var isScrolled = stateIsScrolled[0]; var setIsScrolled = stateIsScrolled[1];
            var stateAlertPopup = React.useState(null); var alertPopup = stateAlertPopup[0]; var setAlertPopup = stateAlertPopup[1];
            var stateShowBackupModal = React.useState(false); var showBackupModal = stateShowBackupModal[0]; var setShowBackupModal = stateShowBackupModal[1];
            var stateBackupName = React.useState("SubLattice_Backup"); var backupName = stateBackupName[0]; var setBackupName = stateBackupName[1];
            var stateTouchStart = React.useState(null); var touchStart = stateTouchStart[0]; var setTouchStart = stateTouchStart[1];

            window._isScrolled = window._isScrolled || false;

            React.useEffect(function() {
                var timer = setTimeout(function() { setIsAppLoading(false); }, 1500);
                var saved = localStorage.getItem('sublattice_data_v5200');
                if (saved) { 
                    try { 
                        var parsed = JSON.parse(saved);
                        var cleaned = parsed.map(function(ws) {
                            var validBin = (ws.deletedSubs || []).filter(function(ds) {
                                return (Date.now() - ds.deletedAt) < THIRTY_DAYS;
                            });
                            return Object.assign({}, ws, { deletedSubs: validBin });
                        });
                        setWorkspaces(cleaned); 
                    } catch(e) {} 
                }
                
                var handleScroll = function() { 
                    var sc = window.scrollY > 40;
                    if (sc !== window._isScrolled) {
                        window._isScrolled = sc;
                        setIsScrolled(sc); 
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return function() { clearTimeout(timer); window.removeEventListener('scroll', handleScroll); };
            }, []);

            React.useEffect(function() { 
                if (workspaces.length > 0) { localStorage.setItem('sublattice_data_v5200', JSON.stringify(workspaces)); }
            }, [workspaces]);

            var activeWS = React.useMemo(function() {
                if (!activeId) return null;
                for (var i = 0; i < workspaces.length; i++) { if (workspaces[i].id === activeId) return workspaces[i]; }
                return null;
            }, [workspaces, activeId]);

            var updateActiveWS = function(data) {
                var newArr = workspaces.map(function(w) { return w.id === activeId ? Object.assign({}, w, data) : w; });
                setWorkspaces(newArr);
            };

            var getGreeting = function() {
                var hour = new Date().getHours();
                if (hour < 12) return "Good Morning";
                if (hour < 18) return "Good Afternoon";
                return "Good Evening";
            };

            var safeStr = function(val) { return val ? String(val) : ""; };

            var metrics = React.useMemo(function() {
                if (!activeWS) return { total: 0, daily: 0, saved: 0, balance: 0 };
                var contextSubs = (activeWS.subs || []).filter(function(s) { return selectedCat === 'All' || s.cat === selectedCat; });
                var active = contextSubs.filter(function(s) { return cutIds.indexOf(s.id) === -1; });
                
                var total = 0;
                for(var i = 0; i < active.length; i++) { total += (parseFloat(active[i].amount) || 0); }
                
                var saved = 0;
                if (isSimulating) {
                    var cutSubs = contextSubs.filter(function(s) { return cutIds.indexOf(s.id) !== -1; });
                    for(var j = 0; j < cutSubs.length; j++) { saved += (parseFloat(cutSubs[j].amount) || 0); }
                }
                
                var bal = (parseFloat(activeWS.salary) || 0) - total;
                return { total: total, daily: (total / 30).toFixed(0), saved: saved, balance: bal };
            }, [activeWS, cutIds, isSimulating, selectedCat]);

            var displaySubs = React.useMemo(function() {
                if (!activeWS) return [];
                if (view === 'bin') {
                    var binned = (activeWS.deletedSubs || []).slice();
                    binned.sort(function(a,b) { return b.deletedAt - a.deletedAt; });
                    return binned;
                }

                var filtered = (activeWS.subs || []).filter(function(s) { return selectedCat === 'All' || s.cat === selectedCat; });
                
                if (searchQuery.trim()) {
                    var sq = searchQuery.toLowerCase();
                    filtered = filtered.filter(function(s) {
                        return (safeStr(s.name).toLowerCase().indexOf(sq) !== -1) ||
                               (safeStr(s.cat).toLowerCase().indexOf(sq) !== -1) ||
                               (safeStr(s.amount).indexOf(sq) !== -1);
                    });
                }

                var sorted = filtered.slice();
                if (sortBy === 'amount_desc') sorted.sort(function(a,b) { return parseFloat(b.amount || 0) - parseFloat(a.amount || 0); });
                else if (sortBy === 'amount_asc') sorted.sort(function(a,b) { return parseFloat(a.amount || 0) - parseFloat(b.amount || 0); });
                else if (sortBy === 'date_asc') sorted.sort(function(a,b) { return parseFloat(a.day || 0) - parseFloat(b.day || 0); });
                else if (sortBy === 'date_desc') sorted.sort(function(a,b) { return parseFloat(b.day || 0) - parseFloat(a.day || 0); });
                else if (sortBy === 'name_asc') sorted.sort(function(a,b) { return safeStr(a.name).localeCompare(safeStr(b.name)); });
                else if (sortBy === 'cat_asc') sorted.sort(function(a,b) { return safeStr(a.cat).localeCompare(safeStr(b.cat)); });
                return sorted;
            }, [activeWS, selectedCat, sortBy, searchQuery, view]);

            var activeWorkspaces = workspaces.filter(function(w) { return !w.deletedAt; });
            var binWorkspaces = workspaces.filter(function(w) { return w.deletedAt; });

            // --- Handlers ---
            var handleTouchStart = function(e) { setTouchStart(e.targetTouches[0].clientX); };
            var handleTouchEnd = function(e) {
                if (touchStart === null || !activeWS) return;
                var touchEnd = e.changedTouches[0].clientX;
                var diff = touchStart - touchEnd;
                var catList = ['All'].concat(activeWS.categories || []);
                var currentIndex = catList.indexOf(selectedCat);
                
                if (diff > 60) { // Swipe Left
                    if (currentIndex < catList.length - 1) setSelectedCat(catList[currentIndex + 1]);
                } else if (diff < -60) { // Swipe Right
                    if (currentIndex > 0) setSelectedCat(catList[currentIndex - 1]);
                }
                setTouchStart(null);
            };

            var finishOnboarding = function() {
                localStorage.setItem('sl_onboard_v12', 'true');
                setHasSeenOnboard(true);
            };

            var saveProfile = function() {
                if (!profDraft.name) return;
                localStorage.setItem('sl_profile_v12', JSON.stringify(profDraft));
                setProfile(profDraft);
                setShowProfileEdit(false);
                if (workspaces.length === 0) {
                    setWorkspaces([{ id: 'ws1', name: 'My Daily Notes', icon: 'Briefcase', color: 'bg-indigo-600', salary: 0, categories: ["Essentials", "Personal"], subs: [], deletedSubs: [] }]);
                }
            };

            var handleSaveWorkspace = function() {
                if (!wsName) return;
                var newWs = { id: 'ws-' + Date.now(), name: wsName, icon: wsIcon, color: wsColor, salary: 0, categories: ["Essentials", "Personal"], subs: [], deletedSubs: [] };
                setWorkspaces(workspaces.concat([newWs]));
                setShowWsModal(false);
                setWsName("");
            };

            var moveToBinWs = function() {
                if (deleteWsId) {
                    var newArr = workspaces.map(function(w) {
                        return w.id === deleteWsId ? Object.assign({}, w, { deletedAt: Date.now() }) : w;
                    });
                    setWorkspaces(newArr);
                    setDeleteWsId(null);
                }
            };

            var restoreWs = function(id) {
                var newArr = workspaces.map(function(w) {
                    if (w.id === id) {
                        var restored = Object.assign({}, w);
                        delete restored.deletedAt;
                        return restored;
                    }
                    return w;
                });
                setWorkspaces(newArr);
            };

            var executePermDeleteWs = function() {
                if (permDeleteWsId) {
                    var newArr = workspaces.filter(function(w) { return w.id !== permDeleteWsId; });
                    setWorkspaces(newArr);
                    setPermDeleteWsId(null);
                }
            };

            var triggerAlert = function(title, message, type) {
                setAlertPopup({ title: title, message: message, type: type || 'info' });
            };

            var confirmBackup = function() {
                try {
                    var backupData = {
                        workspaces: workspaces,
                        profile: profile,
                        onboard: hasSeenOnboard,
                        timestamp: Date.now()
                    };
                    var jsonStr = JSON.stringify(backupData);
                    var b64 = btoa(unescape(encodeURIComponent(jsonStr)));
                    var encryptedStr = b64.split('').reverse().join('');
                    
                    var blob = new Blob([encryptedStr], { type: "text/plain" });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = (backupName || "SubLattice_Backup") + "_" + new Date().getTime() + ".txt";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    setShowBackupModal(false);
                    triggerAlert("Backup Successful", "Encrypted backup file has been securely downloaded to your device.", "success");
                } catch(e) {
                    setShowBackupModal(false);
                    triggerAlert("Backup Error", "An error occurred while encrypting and generating the backup file.", "error");
                }
            };

            var handleRestore = function(e) {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        var encryptedStr = evt.target.result;
                        var b64 = encryptedStr.split('').reverse().join('');
                        var jsonStr = decodeURIComponent(escape(atob(b64)));
                        var data = JSON.parse(jsonStr);
                        
                        if (data && data.workspaces) {
                            setWorkspaces(data.workspaces);
                            if (data.profile !== undefined) {
                                setProfile(data.profile);
                                localStorage.setItem('sl_profile_v12', JSON.stringify(data.profile));
                            }
                            if (data.onboard !== undefined) {
                                setHasSeenOnboard(data.onboard);
                                localStorage.setItem('sl_onboard_v12', 'true');
                            }
                            
                            localStorage.setItem('sublattice_data_v5200', JSON.stringify(data.workspaces));
                            triggerAlert("Restore Successful", "Your data and settings have been safely restored from the backup file.", "success");
                        } else {
                            triggerAlert("Invalid File", "The uploaded file format is not a valid SubLattice backup.", "error");
                        }
                    } catch(err) {
                        triggerAlert("Decryption Error", "Could not decrypt the backup. Please ensure you uploaded the correct SubLattice .txt file.", "error");
                    }
                    e.target.value = null;
                };
                reader.readAsText(file);
            };

            var handleSaveNote = function() {
                if (!modal || !modal.name) return;
                var currentCats = (activeWS.categories || []).slice();
                if (currentCats.indexOf(modal.cat) === -1 && modal.cat) { currentCats.push(modal.cat); }
                
                var newSubs = (activeWS.subs || []).slice();
                if (modal.id) {
                    for(var i=0; i<newSubs.length; i++) { 
                        if(newSubs[i].id === modal.id) newSubs[i] = Object.assign({}, modal); 
                    }
                } else {
                    var newNote = Object.assign({}, modal, { id: "n-" + Date.now() });
                    newSubs.push(newNote);
                }
                updateActiveWS({ subs: newSubs, categories: currentCats });
                setModal(null);
            };

            var moveToBinNote = function() {
                if (deleteNoteId) {
                    var targetSub = null;
                    var newSubs = (activeWS.subs || []).filter(function(s) { 
                        if (s.id === deleteNoteId) { targetSub = s; return false; }
                        return true;
                    });
                    if (targetSub) {
                        targetSub.deletedAt = Date.now();
                        var newBin = (activeWS.deletedSubs || []).concat([targetSub]);
                        updateActiveWS({ subs: newSubs, deletedSubs: newBin });
                    }
                    setDeleteNoteId(null);
                }
            };

            var restoreNote = function(id) {
                var targetSub = null;
                var newBin = (activeWS.deletedSubs || []).filter(function(s) {

                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                        })}
                                        ${displaySubs.length === 0 ? html`<div className="col-span-full py-10 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Bin is empty</div>` : null}
                                    </div>
                                </div>
                            ` : null}
                        </main>
                    </div>

                    <div className="py-8 text-center opacity-40 mt-auto no-print">
                        <${Icon} name="Heart" size=${12} className="text-rose-500 fill-rose-500 mx-auto mb-1.5" />
                        <p className="text-[8px] font-bold uppercase tracking-widest text-slate-500">Built with love</p>
                    </div>

                    ${modal ? html`
                        <div className="fixed inset-0 z-[600] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-[300px] rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in-95">
                                <div className="p-3.5 bg-slate-50 border-b flex justify-between items-center shrink-0">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-800">Record Info</h3>
                                    <button onClick=${function(){setModal(null);}} className="p-1.5 bg-white rounded-full shadow-sm active:scale-95"><${Icon} name="Close" size=${12} className="text-slate-400"/></button>
                                </div>
                                <div className="p-4 space-y-3 max-h-[70vh] overflow-y-auto no-scrollbar">
                                    <div><label className="text-[8px] font-black uppercase text-slate-400 ml-1 block">Title</label><input value=${modal.name || ""} onChange=${function(e){setModal(Object.assign({}, modal, {name:e.target.value}));}} className="w-full bg-slate-100 rounded-xl px-3 py-2 font-bold outline-none border border-transparent focus:border-indigo-200 mt-1 text-sm shadow-inner" placeholder="Name..." /></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="text-[8px] font-black uppercase text-slate-400 ml-1 block">Amount (₹)</label><input type="number" value=${modal.amount || ""} onChange=${function(e){setModal(Object.assign({}, modal, {amount:e.target.value}));}} className="w-full bg-slate-100 rounded-xl px-3 py-2 font-bold outline-none border border-transparent focus:border-indigo-200 mt-1 text-sm shadow-inner" placeholder="0" /></div>
                                        <div><label className="text-[8px] font-black uppercase text-slate-400 ml-1 block">Date</label><input type="date" value=${modal.rawDate || ""} className="w-full bg-slate-100 rounded-xl px-2 py-2 font-bold outline-none text-[10px] mt-1 shadow-inner" onChange=${function(e){if(e.target.value){var d=new Date(e.target.value); setModal(Object.assign({}, modal, {day:d.getDate(), rawDate:e.target.value}));}}} /></div>
                                    </div>
                                    
                                    <div className="p-2.5 bg-indigo-50 rounded-xl flex justify-between items-center"><span className="text-[9px] font-black uppercase text-indigo-900 ml-1 tracking-widest">Auto-Pay</span><button onClick=${function(){setModal(Object.assign({}, modal, {isAutoPay:!modal.isAutoPay}));}} className=${`px-3 py-1.5 rounded-lg text-[8px] font-black transition-all ${modal.isAutoPay ? 'bg-indigo-600 text-white shadow-md' : 'bg-white border border-slate-200'}`}>${modal.isAutoPay ? 'ON' : 'OFF'}</button></div>
                                    
                                    <div className="space-y-2 pt-2 border-t border-slate-100">
                                        <div className="grid grid-cols-2 gap-2">
                                            <div className="grid grid-cols-3 gap-1 bg-slate-50 p-1.5 rounded-xl">
                                                ${ICON_LIST.map(function(k){return html`<button key=${k} onClick=${function(){setModal(Object.assign({}, modal, {icon:k}));}} className=${`p-1.5 rounded-lg flex items-center justify-center transition-all ${modal.icon === k ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-300'}`}><${Icon} name=${k} size=${12}/></button>`;})}
                                            </div>
                                            <div className="flex flex-col gap-1.5">
                                                ${modal.isCustomMode ? html`<input autoFocus className="w-full bg-slate-50 rounded-lg px-2 py-1.5 text-[9px] font-bold text-slate-800 border border-indigo-300 shadow-inner" placeholder="Cat Name..." onBlur=${function(e){if(e.target.value) setModal(Object.assign({}, modal, {cat:e.target.value, isCustomMode:false})); else setModal(Object.assign({}, modal, {isCustomMode:false}));}} />` : html`<select value=${modal.cat || ""} onChange=${function(e){if(e.target.value === 'NEW_CAT') setModal(Object.assign({}, modal, {isCustomMode:true})); else setModal(Object.assign({}, modal, {cat: e.target.value}));}} className="w-full bg-slate-100 rounded-xl px-2 py-1.5 text-[9px] font-black uppercase outline-none shadow-sm text-slate-700 cursor-pointer">${(activeWS.categories || []).map(function(c){return html`<option key=${c} value=${c}>${c}</option>`;})}<option value="NEW_CAT">+ Custom...</option></select>`}
                                                <div className="flex flex-wrap gap-1 justify-center mt-1">${COLOR_PALETTE.map(function(c){return html`<button key=${c} onClick=${function(){setModal(Object.assign({}, modal, {color: c}));}} className=${`w-3.5 h-3.5 rounded-full ${c} ${modal.color === c ? 'ring-2 ring-indigo-200 scale-110' : 'opacity-40'}`} />`;})}</div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-2 pt-2 border-t border-slate-100">
                                        <div className="flex justify-between items-center"><span className="text-[8px] font-black uppercase text-slate-400">Metadata</span><button onClick=${function(){setModal(Object.assign({}, modal, {fields: (modal.fields || []).concat([{ label: 'Note', value: '', isCustomMode: false }])}));}} className="text-indigo-600 text-[8px] font-bold bg-indigo-50 px-2 py-1 rounded shadow-sm active:scale-95">+ Row</button></div>
                                        ${(modal.fields || []).map(function(f, i){return html`
                                            <div key=${i} className="flex gap-1 bg-slate-50 p-1.5 rounded-xl border border-slate-100 items-center">
                                                ${f.isCustomMode ? html`<input autoFocus className="w-[35%] bg-white rounded-md px-1.5 py-1 text-[8px] font-bold border border-indigo-200 shadow-sm" placeholder="Key..." value=${f.label || ""} onChange=${function(e){var n=JSON.parse(JSON.stringify(modal.fields || [])); n[i].label=e.target.value; setModal(Object.assign({}, modal, {fields:n}));}} />` : html`<select value=${f.label || ""} onChange=${function(e){var n=JSON.parse(JSON.stringify(modal.fields || [])); if(e.target.value === 'CUSTOM_KEY') { n[i].isCustomMode = true; n[i].label = ''; } else { n[i].label = e.target.value; } setModal(Object.assign({}, modal, {fields:n}));}} className="w-[35%] bg-white rounded-md px-1 py-1 text-[8px] font-bold border outline-none cursor-pointer"><option value="Note">Note</option><option value="Account">Account</option><option value="CUSTOM_KEY">Other..</option></select>`}
                                                <input value=${f.value || ""} onChange=${function(e){var n=JSON.parse(JSON.stringify(modal.fields || [])); n[i].value=e.target.value; setModal(Object.assign({}, modal, {fields:n}));}} className="flex-1 bg-white rounded-md px-2 py-1 text-[8px] font-bold border shadow-sm" placeholder="Info..." />
                                                <button onClick=${function(){setModal(Object.assign({}, modal, {fields: modal.fields.filter(function(_,idx){return idx!==i;})}));}} className="p-1.5 bg-white rounded-md border text-rose-500 shadow-sm active:scale-95"><${Icon} name="Trash" size=${10} /></button>
                                            </div>
                                        `;})}
                                    </div>
                                    <button onClick=${function(){handleSaveNote();}} className="w-full font-black py-3 bg-indigo-600 text-white rounded-[1rem] shadow-lg text-xs active:scale-95 transition-all mt-1 tracking-widest uppercase">${modal.id ? "Update" : "Save Record"}</button>
                                </div>
                            </div>
                        </div>
                    ` : null}

                    ${quickLook ? html`
                        <div className="fixed inset-0 z-[700] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] p-5 w-full max-w-[280px] shadow-2xl animate-in zoom-in-95">
                                <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                                    <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-1.5"><${Icon} name="Alert" size=${12} className="text-amber-500" /> Bin Record</h3>
                                    <button onClick=${function(){setQuickLook(null);}} className="bg-slate-50 p-1.5 rounded-full text-slate-400 hover:text-slate-600 transition-colors"><${Icon} name="Close" size=${12} /></button>
                                </div>
                                <div className="p-4 bg-slate-50 rounded-[1.5rem] mb-4 border border-slate-100 relative overflow-hidden">
                                    <div className="flex items-center gap-3 mb-3">
                                        <div className=${`w-10 h-10 rounded-xl ${quickLook.color || 'bg-indigo-600'} text-white flex items-center justify-center shadow-sm grayscale`}><${Icon} name=${quickLook.icon || 'Home'} size=${18}/></div>
                                        <div className="flex flex-col">
                                            <h4 className="font-bold text-base text-slate-800 leading-tight">${quickLook.name || ''}</h4>
                                            <span className="text-[8px] font-black text-slate-500 uppercase mt-0.5">${quickLook.cat || ''} • Day ${quickLook.day || 1}</span>
                                        </div>
                                    </div>
                                    <div className="text-2xl font-black text-slate-900 mb-3 tracking-tight">₹${(parseFloat(quickLook.amount)||0).toLocaleString()}</div>
                                    
                                    ${(quickLook.fields && quickLook.fields.length > 0) ? html`
                                        <div className="space-y-1.5 pt-3 border-t border-slate-200/60">
                                            ${quickLook.fields.map(function(f, i){ return html`
                                                <div key=${i} className="flex justify-between items-center bg-white px-2 py-1.5 rounded-lg border border-slate-100">
                                                    <span className="text-[8px] font-bold text-slate-400 uppercase">${f.label}</span>
                                                    <span className="text-[9px] font-black text-slate-700">${f.value}</span>
                                                </div>
                                            `; })}
                                        </div>
                                    ` : null}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick=${function(){restoreNote(quickLook.id);}} className="flex-1 py-3 bg-emerald-500 text-white rounded-xl font-black text-[10px] active:scale-95 transition-all uppercase shadow-md shadow-emerald-200">Restore</button>
                                    <button onClick=${function(){ setPermDeleteNoteId(quickLook.id); }} className="flex-1 py-3 bg-slate-100 text-rose-500 rounded-xl font-black text-[10px] active:scale-95 transition-all uppercase border border-slate-200 hover:bg-rose-50">Delete</button>
                                </div>
                            </div>
                        </div>
                    ` : null}

                    ${deleteNoteId ? html`
                        <div className="fixed inset-0 z-[700] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] p-5 w-full max-w-[280px] shadow-2xl animate-in zoom-in-95 text-center">
                                <div className="w-12 h-12 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-3 border border-amber-100"><${Icon} name="Archive" size=${18} /></div>
                                <h3 className="text-base font-black text-slate-800 mb-1">Move to Bin?</h3>
                                <p className="text-[9px] font-bold text-slate-500 mb-5 uppercase tracking-widest">Kept for 30 days.</p>
                                <div className="flex gap-2">
                                    <button onClick=${function(){setDeleteNoteId(null);}} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-black text-[10px] active:scale-95 transition-all uppercase border border-slate-200">Cancel</button>
                                    <button onClick=${function(){ moveToBinNote(); }} className="flex-1 py-3 bg-amber-500 text-white rounded-xl font-black text-[10px] shadow-md active:scale-95 transition-all uppercase">Move</button>
                                </div>
                            </div>
                        </div>
                    ` : null}

                    ${permDeleteNoteId ? html`
                        <div className="fixed inset-0 z-[700] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] p-5 w-full max-w-[280px] shadow-2xl animate-in zoom-in-95 text-center">
                                <div className="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3 border border-rose-100"><${Icon} name="Trash" size=${18} /></div>
                                <h3 className="text-base font-black text-slate-800 mb-1">Delete Permanently?</h3>
                                <p className="text-[9px] font-bold text-slate-500 mb-5 uppercase tracking-widest">This action cannot be undone.</p>
                                <div className="flex gap-2">
                                    <button onClick=${function(){setPermDeleteNoteId(null);}} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-black text-[10px] active:scale-95 transition-all uppercase border border-slate-200">Cancel</button>
                                    <button onClick=${function(){ executePermDeleteNote(); }} className="flex-1 py-3 bg-rose-500 text-white rounded-xl font-black text-[10px] shadow-md active:scale-95 transition-all uppercase">Delete</button>
                                </div>
                            </div>
                        </div>
                    ` : null}

                    ${showPrint ? html`
                        <div className="fixed inset-0 z-[600] bg-white flex flex-col print-view p-4">
                            <div className="no-print p-4 bg-slate-50 border-b flex justify-between items-center max-w-4xl mx-auto w-full rounded-t-[2rem] shadow-sm mt-4">
                                <h3 className="font-black text-sm flex items-center gap-2"><${Icon} name="Printer" size=${16}/> Print</h3>
                                <div className="flex gap-2">
                                    <button id="pdf-btn" onClick=${downloadPDF} className="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold text-[10px] shadow-lg active:scale-95 transition-all">Download PDF</button>
                                    <button onClick=${function(){setShowPrint(false);}} className="px-5 py-2.5 bg-slate-200 text-slate-600 rounded-xl font-bold text-[10px] active:scale-95">Close</button>
                                </div>
                            </div>
                            <div id="pdf-document-content" className="max-w-4xl mx-auto p-6 w-full bg-white">
                                <h1 className="text-3xl font-black text-slate-900 tracking-tighter uppercase leading-none">OFFICIAL RECORDS</h1>
                                <p className="text-[9px] border-b-2 border-slate-900 pb-3 mb-6 tracking-widest text-slate-500 uppercase mt-2">Map: ${activeWS.name} | Holder: ${profile ? profile.name : ''} | Generated: ${new Date().toLocaleDateString()}</p>
                                <div className="grid grid-cols-4 gap-2 mb-6">
                                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col justify-center"><p className="text-[6px] font-bold uppercase text-slate-400 mb-0.5">Income</p><p className="text-xs font-black text-slate-800">₹${activeWS.salary || 0}</p></div>
                                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col justify-center"><p className="text-[6px] font-bold uppercase text-slate-400 mb-0.5">Net Balance</p><p className="text-xs font-black text-indigo-600">₹${metrics.balance}</p></div>
                                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col justify-center"><p className="text-[6px] font-bold uppercase text-slate-400 mb-0.5">Spend (${selectedCat})</p><p className="text-xs font-black text-slate-800">₹${metrics.total}</p></div>
                                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col justify-center"><p className="text-[6px] font-bold uppercase text-slate-400 mb-0.5">Reduction</p><p className="text-xs font-black text-amber-500">₹${metrics.saved}</p></div>
                                </div>
                                <table className="w-full text-left border-collapse">
                                    <thead><tr className="border-b-2 border-slate-900"><th className="py-2 px-2 text-[8px] font-black uppercase tracking-widest">Detail Name</th><th className="py-2 text-center text-[8px] font-black uppercase tracking-widest">Day</th><th className="py-2 px-2 text-right text-[8px] font-black uppercase tracking-widest">Amount</th></tr></thead>
                                    <tbody>${displaySubs.map(function(s){ return html`<tr key=${s.id} className="border-b border-slate-100"><td className="py-3 px-2 font-bold text-xs text-slate-800 leading-tight">${s.name || ''}<br/><span className="text-[6px] text-indigo-600 uppercase font-black tracking-widest mt-0.5 inline-block">${s.cat || ''}</span><div className="mt-1">${(s.fields || []).map(function(f){ return html`<span className="text-[5px] text-slate-500 bg-slate-50 border px-1 rounded mr-1">${f.label}: ${f.value}</span>`; })}</div></td><td className="py-3 text-center text-[8px] font-bold text-slate-500 uppercase">Day ${s.day || 1}</td><td className="py-3 px-2 text-right font-black text-sm text-slate-900">₹${(s.amount||0).toLocaleString()}</td></tr>`; })}</tbody>
                                </table>
                            </div>
                        </div>
                    ` : null}

                    ${view !== 'bin' ? html`
                        <button onClick=${function(){setModal({ name: '', amount: '', day: 1, cat: activeWS.categories[0] || 'General', icon: 'Home', color: 'bg-indigo-600', isAutoPay: false, fields: [] });}} 
                            className="fixed bottom-6 right-5 w-12 h-12 bg-indigo-600/90 backdrop-blur-md text-white rounded-full shadow-2xl flex items-center justify-center z-40 no-print active:scale-95 transition-all shadow-indigo-200">
                            <${Icon} name="Plus" size=${20} />
                        </button>
                    ` : null}
                </div>
            `;
        };

        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
